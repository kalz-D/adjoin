<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Adjoin</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/members/members.css" />
</head>
<body class="m-body" data-page="admin">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header scrolled">
    <div class="wrap header-inner">
      <a href="/" class="brand" aria-label="Adjoin home">
        <svg class="mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <rect class="m-core" x="12.5" y="12.5" width="7" height="7" fill="var(--signal)"/>
          <rect class="m-a" x="1.5" y="1.5" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect class="m-b" x="12.5" y="12.5" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span class="brand-word">adjoin</span>
        <span class="brand-tag">Collaborative spaces</span>
      </a>
      <nav class="m-nav" aria-label="Members" hidden>
        <a href="/members/circle.html" data-nav="circle">Your circle</a>
        <a href="/members/me.html" data-nav="me">Your profile</a>
        <a href="/members/admin.html" data-nav="admin" hidden>Admin</a>
        <button type="button" class="m-signout">Sign out</button>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="wrap ad-head">
      <p class="m-eyebrow"><span class="sq" aria-hidden="true"></span>Admin</p>
      <h1 class="m-title">Who's in.</h1>
      <p class="m-lead">Welcome new members, hide a profile if you need to, and see who's asked to be introduced.</p>
    </div>
    <div class="wrap">
      <div class="ad-tabs" role="group" aria-label="Show">
        <button type="button" data-tab="pending" aria-pressed="true">Waiting</button>
        <button type="button" data-tab="live" aria-pressed="false">Live</button>
        <button type="button" data-tab="hidden" aria-pressed="false">Hidden</button>
        <button type="button" data-tab="draft" aria-pressed="false">Drafts</button>
        <button type="button" data-tab="intros" aria-pressed="false">Introductions</button>
        <button type="button" data-tab="reset" aria-pressed="false">Reset a password</button>
      </div>
      <p class="form-error" id="adminError" role="alert"></p>
      <div class="ad-list" id="adminList" aria-live="polite">
        <div class="m-loading"><span class="sq" aria-hidden="true"></span>Loading</div>
      </div>
    </div>
  </main>

  <script src="/members/members.js" type="module"></script>
</body>
</html>

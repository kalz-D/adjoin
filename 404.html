<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Adjoin</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .msg-page { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px var(--gutter); }
    .msg-inner { max-width: 46ch; }
    .msg-code { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; }
    .msg-inner h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.4rem, 8vw, 5rem); letter-spacing: -0.03em; line-height: 0.98; margin-bottom: 16px; }
    .msg-inner p { color: var(--ink-soft); margin-bottom: 30px; }
  </style>
</head>
<body>
  <main class="msg-page">
    <div class="msg-inner">
      <p class="msg-code">Error 404 · No such room</p>
      <h1>This space doesn&rsquo;t exist&nbsp;yet.</h1>
      <p>The page you&rsquo;re looking for has moved on, or was never built. Let&rsquo;s get you back to the front door.</p>
      <a href="/" class="btn btn-solid">← Back to Adjoin</a>
    </div>
  </main>
</body>
</html>

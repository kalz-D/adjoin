<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank you — Adjoin</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .msg-page { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px var(--gutter); }
    .msg-inner { max-width: 44ch; }
    .msg-mark { display: inline-flex; align-items: center; justify-content: center; width: 58px; height: 58px; border: 1.5px solid var(--ink); border-radius: 50%; font-size: 1.5rem; margin-bottom: 26px; }
    .msg-inner h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.025em; line-height: 1.04; margin-bottom: 16px; }
    .msg-inner p { color: var(--ink-soft); margin-bottom: 30px; }
    .msg-inner a.mail { color: var(--ink); border-bottom: 1px solid var(--accent); }
  </style>
</head>
<body>
  <main class="msg-page">
    <div class="msg-inner">
      <span class="msg-mark" aria-hidden="true">✓</span>
      <p class="kicker" style="justify-content:center;"><span class="kdot"></span>Message received</p>
      <h1>Thank you.</h1>
      <p>We&rsquo;ve got your details and we&rsquo;ll be in touch soon. In the meantime, feel free to email us directly at <a class="mail" href="mailto:connect@careinmovement.com">connect@careinmovement.com</a>.</p>
      <a href="/" class="btn btn-solid">← Back to Adjoin</a>
    </div>
  </main>
</body>
</html>
